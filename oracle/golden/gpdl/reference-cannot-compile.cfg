# Corpus scripts the REFERENCE compiler cannot produce a golden for.
#
# One filename per line. Blank lines and #-comments are ignored. The extension is deliberately
# not .txt, .bin or .lst so this file matches none of the corpus globs.
#
# Three consumers read this, and it exists so they cannot drift apart:
#   - dotnet/tests/UAF.Scripting.Tests/GpdlOracleDiffTests.cs  (ReferenceCannotCompile)
#   - .github/workflows/oracle-cpp.yml                          (Compile GPDL goldens)
#   - .github/workflows/dotnet.yml                              (the missing-bytecode warning)
#
# A name here means "GPDLcomp.exe cannot compile this", NOT "the port cannot". The port must still
# compile every listed script -- Every_excluded_script_exists_and_compiles_here asserts exactly
# that, so this file can never be used to hide a defect on our side.
#
# See README.md for the diagnosis behind each entry.

prototypes.txt

# Reference ("oracle") build of the legacy C++ tree.
#
# Purpose: the C# port in dotnet/ is validated by diffing its output against this
# build's output on identical inputs. See docs/PORTING-PLAN.md section 7, Phase 0.
#
# The build and dump steps are GATING: the tree builds green as of the v143 retarget, so a
# regression must fail the job rather than be quietly summarised. Only the two environment
# probes are soft, since they are diagnostics rather than requirements.
#
# Caution when reading results: `continue-on-error` rewrites a step's `conclusion` to
# "success", so only `outcome` (rendered in the Summary table) reports the truth. A step whose
# script writes ::error:: but does not `exit` non-zero also reports success -- every script
# here must exit non-zero on failure.

name: Oracle (C++ reference build)

on:
  push:
    paths:
      - 'src/**'
      - 'oracle/**'
      - '.github/workflows/oracle-cpp.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# UAFWinEd takes ~10 min to compile. Without this, pushing three times in a row leaves three
# full builds racing and makes it ambiguous which run's artifacts are current.
concurrency:
  group: oracle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: MSVC v143 / Win32
    # Pinned, not 'windows-latest'. The latest image ships VS 2026 (MSBuild 18.x) whose
    # default toolset is v144; windows-2022 has VS 2022 with v143 native, matching what the
    # retargeted vcxproj files ask for. See the MFC note on the install step below.
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Report toolchain
        shell: pwsh
        run: |
          msbuild -version
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          Write-Host "VS install : $vs"
          Write-Host "VS version : $(& $vswhere -latest -products * -property installationVersion)"
          # Report MFC per toolset AND per architecture. A wildcard Test-Path is useless here:
          # MSB8041 fires when MFC is missing for the specific toolset+arch being built, even
          # though some other toolset has it.
          Write-Host "--- MFC (nafxcw.lib) by toolset/arch ---"
          Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | ForEach-Object {
            foreach ($arch in @('x86','x64')) {
              $lib = Join-Path $_.FullName "atlmfc\lib\$arch\nafxcw.lib"
              "{0,-16} {1,-4} {2}" -f $_.Name, $arch, $(if (Test-Path $lib) { 'PRESENT' } else { 'missing' })
            }
          }

      # The legacy multimedia import libs (vfw32, ddraw, dsound, ...) are not present in every
      # Windows SDK. The vcxproj files pin WindowsTargetPlatformVersion to PINNED_SDK below;
      # this step reports availability PER SDK VERSION so a LNK1181 is diagnosable in one run
      # instead of one round-trip per missing lib.
      - name: Probe legacy link inputs (per SDK version)
        shell: pwsh
        continue-on-error: true
        env:
          PINNED_SDK: '10.0.17763.0'
        run: |
          $root = "${env:ProgramFiles(x86)}\Windows Kits\10\Lib"
          $libs = @('ddraw.lib','dxguid.lib','dsound.lib','vfw32.lib','winmm.lib','amstrmid.lib')
          $versions = Get-ChildItem $root -Directory | Select-Object -Expand Name | Sort-Object
          Write-Host "Installed SDK lib roots: $($versions -join ', ')"
          Write-Host ("{0,-16} {1}" -f 'SDK', ($libs -join '  '))
          foreach ($v in $versions) {
            $cells = foreach ($lib in $libs) {
              if (Test-Path (Join-Path $root "$v\um\x86\$lib")) { 'yes' } else { 'NO ' }
            }
            "{0,-16} {1}" -f $v, ($cells -join '   ')
          }
          Write-Host ""
          if ($versions -notcontains $env:PINNED_SDK) {
            Write-Host "::error::Pinned SDK $env:PINNED_SDK is not installed on this image. Update WindowsTargetPlatformVersion in the vcxproj files to one of: $($versions -join ', ')"
          } else {
            $missing = $libs | Where-Object { -not (Test-Path (Join-Path $root "$env:PINNED_SDK\um\x86\$_")) }
            if ($missing) { Write-Host "::error::Pinned SDK $env:PINNED_SDK is missing: $($missing -join ', ')" }
            else { Write-Host "Pinned SDK $env:PINNED_SDK has all $($libs.Count) required libs." }
          }

      # Ensure MFC exists for the toolset+arch we actually build. windows-2022 normally ships
      # ATLMFC, but the component set drifts between image releases, so install it idempotently
      # rather than depending on the image. This is a no-op when already present.
      - name: Ensure MFC for v143 (x86)
        shell: pwsh
        continue-on-error: true
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          if (Test-Path "$vs\VC\Tools\MSVC\*\atlmfc\lib\x86\nafxcw.lib") {
            Write-Host "MFC x86 already present - skipping install."; exit 0
          }
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $args = @('modify','--installPath',"`"$vs`"",
                    '--add','Microsoft.VisualStudio.Component.VC.ATLMFC',
                    '--add','Microsoft.VisualStudio.Component.VC.v143.ATL',
                    '--add','Microsoft.VisualStudio.Component.VC.v143.MFC',
                    '--quiet','--norestart','--nocache')
          Write-Host "Installing MFC components (this takes several minutes)..."
          $p = Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
          Write-Host "vs_installer exit code: $($p.ExitCode)"
          if (Test-Path "$vs\VC\Tools\MSVC\*\atlmfc\lib\x86\nafxcw.lib") { Write-Host "MFC x86 now PRESENT" }
          else { Write-Host "::warning::MFC x86 still missing after install attempt" }

      # NOTE: CDX is deliberately NOT built. CDX_vs2013.vcxproj compiles ..\PNG\*.c, and the
      # libpng sources are not in this repository (only prebuilt libpng*.lib and headers under
      # src/Shared). The prebuilt src/Shared/cdx.lib and cdxd.lib are what UAFWin actually links
      # against, and MSVC guarantees binary compatibility from v140 onward, so rebuilding CDX is
      # unnecessary for the oracle. Restore this step only if the PNG sources are ever vendored.

      - name: Build GPDLcomp (script compiler)
        id: gpdl
        run: msbuild src\GPDL\GPDLcomp_vs2013.vcxproj /p:Configuration=Release /p:Platform=Win32 /m /v:minimal

      - name: Build UAFWin (engine)
        id: uafwin
        run: msbuild src\UAFWin\UAFWin_vs2013.vcxproj /p:Configuration=Release /p:Platform=Win32 /m /v:minimal

      - name: Build UAFWinEd (editor)
        id: uafwined
        run: msbuild src\UAFWinEd\UAFWinEd_vs2013.vcxproj /p:Configuration=Release /p:Platform=Win32 /m /v:minimal

      # Stage the editor's install layout beside the exe.
      #
      # The editor resolves its own resources from the EXECUTABLE's directory
      # (EDITOR_ENVIRONMENT::DefaultFoldersFromExecutable, Globals.cpp:467):
      #     <exeDir>\EditorResources\        -- MAPART, help files
      #     <exeDir>\TemplateDesign.dsn\     -- BASS.DLL, ReadMe.txt, Data\, Resources\
      # A build output folder has none of it, which is why LoadConfigFile fails ("Please
      # re-install Dungeon Craft") and why saveDesign() fails when it tries to copy BASS.DLL out
      # of the template dir. Staging it here fixes both without touching the source tree.
      - name: Stage editor install layout
        shell: pwsh
        run: |
          $rel = "src\UAFWinEd\Release"
          New-Item -ItemType Directory -Force -Path $rel | Out-Null
          Copy-Item "src\UAFWinEd\EditorResources" "$rel\EditorResources" -Recurse -Force
          Copy-Item "src\UAFWinEd\DefaultDesign.dsn" "$rel\TemplateDesign.dsn" -Recurse -Force
          # TemplateOverlandArtDir() is <template>\Resources\; create it even if empty so the
          # lookup has somewhere to look rather than failing on a missing directory.
          New-Item -ItemType Directory -Force -Path "$rel\TemplateDesign.dsn\Resources" | Out-Null
          Write-Host "staged:"
          Get-ChildItem $rel -Directory | ForEach-Object { "  $($_.Name)" }

      # Produce the golden file. -dumpjson sets headless mode, which suppresses every modal
      # dialog (MsgBoxError would otherwise block until the job times out). -config is
      # mandatory: OpenDesign("") falls back to XBrowseForFolder, a modal folder picker.
      - name: Dump DefaultDesign to canonical JSON
        id: dump
        timeout-minutes: 5
        shell: pwsh
        run: |
          $exe = (Resolve-Path "src\UAFWinEd\Release\UAFWinEd.exe" -ErrorAction SilentlyContinue)
          if (-not $exe) { Write-Host "::error::UAFWinEd.exe not built"; exit 1 }
          $design = (Resolve-Path "src\UAFWinEd\DefaultDesign.dsn").Path
          $out    = "$env:RUNNER_TEMP\DefaultDesign.json"
          Write-Host "design: $design"

          # UAFWinEd is a WINDOWS (GUI) subsystem binary. PowerShell's call operator does NOT
          # wait for GUI processes, so `& $exe ...` returns instantly with $LASTEXITCODE unset
          # and the file-existence check below races the process. Start-Process -Wait is required.
          # ARGUMENT FORM IS NOT THE USUAL ONE. CUAFCommandLineInfo::ParseParam
          # (Globals.cpp:817) splits flag from value with strchr(param, ' ') INSIDE a single
          # token, so each flag and its value must be passed as ONE quoted argument:
          #     "-config D:\path\x.dsn"     not     -config D:\path\x.dsn
          # The editor itself launches the engine this way (MainFrm.cpp:2648,
          # `"%s" "-warp %i,%i,%i,%i"`). Passing them separately leaves the value empty, and
          # the app then exits 0 having done nothing.
          $p = Start-Process -FilePath $exe.Path `
                             -ArgumentList @("`"-config $design`"", "`"-dumpjson $out`"") `
                             -Wait -PassThru -NoNewWindow
          Write-Host "exit code: $($p.ExitCode)"

          if (-not (Test-Path $out)) {
            Write-Host "::error::no JSON produced at $out"
            Get-ChildItem -Path . -Recurse -Filter 'UAFErrors*.txt' -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "--- $($_.FullName) ---"; Get-Content $_.FullName -Tail 40 }
            exit 1        # the step must FAIL, not silently report success with no output
          }

          Write-Host "--- first 60 lines of dump ---"
          Get-Content $out -TotalCount 60
          Copy-Item $out "oracle-DefaultDesign.json"

          # _meta.ok is false when the flags parsed but the design failed to load. The file
          # exists in that case, so the artifact is still uploaded for inspection, but it is
          # not golden data and must not be treated as ground truth.
          $meta = (Get-Content $out -Raw | ConvertFrom-Json)._meta
          if (-not $meta.ok) {
            Write-Host "--- diagnostics ---"
            $meta.diagnostics | ForEach-Object { Write-Host "  $_" }
            Write-Host "environmentReady=$($meta.environmentReady) designLoaded=$($meta.designLoaded)"
            Write-Host "::error::design failed to load; dump is not golden data"
            exit 1
          }
          Write-Host "design loaded OK; version $($meta.designVersion)"

      # Generate the tier-3 (LZW) fixture.
      #
      # No design in the repository exercises CAR's compression path: DefaultDesign is 0.915025,
      # which is tier 1 or 2 everywhere. Re-saving it stamps PRODUCT_VER (5.29), past the 0.930
      # gate at which the databases enable Compress(true) -- so the rewritten files are exactly
      # the fixture the C# LZW decoder needs.
      #
      # Runs on a COPY: -savedesign overwrites the design in place, and the pristine
      # DefaultDesign is the baseline for every other test.
      - name: Generate tier-3 (LZW) fixture
        id: tier3
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $exe    = (Resolve-Path "src\UAFWinEd\Release\UAFWinEd.exe").Path
          $src    = (Resolve-Path "src\UAFWinEd\DefaultDesign.dsn").Path
          $copy   = "$env:RUNNER_TEMP\Tier3Design.dsn"
          $out    = "$env:RUNNER_TEMP\Tier3Design.json"
          Copy-Item $src $copy -Recurse -Force
          Write-Host "copy: $copy"

          $p = Start-Process -FilePath $exe `
                             -ArgumentList @("`"-config $copy`"", '"-savedesign"', "`"-dumpjson $out`"") `
                             -Wait -PassThru -NoNewWindow
          Write-Host "exit code: $($p.ExitCode)"
          if (-not (Test-Path $out)) { Write-Host "::error::no tier-3 dump produced"; exit 1 }

          $meta = (Get-Content $out -Raw | ConvertFrom-Json)._meta
          Write-Host "designSaved=$($meta.designSaved) version=$($meta.designVersion)"
          $meta.diagnostics | ForEach-Object { Write-Host "  $_" }
          if (-not $meta.designSaved) { Write-Host "::error::save did not happen"; exit 1 }
          if ($meta.designVersion -lt 0.930) {
            Write-Host "::error::saved design is $($meta.designVersion), below the 0.930 compression gate - not a tier-3 fixture"
            exit 1
          }

          # Package the rewritten design so it can be committed as a fixture.
          New-Item -ItemType Directory -Force -Path tier3 | Out-Null
          Copy-Item "$copy\Data\*" tier3\ -Force
          Copy-Item $out "tier3\Tier3Design.json" -Force
          Get-ChildItem tier3 | ForEach-Object { "{0,-20} {1,8} bytes" -f $_.Name, $_.Length }

      - name: Upload tier-3 fixture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier3-fixture
          path: tier3/**
          if-no-files-found: warn

      # Compile the GPDL golden corpus with the REFERENCE compiler.
      #
      # This is what activates GpdlOracleDiffTests, and with it Phase 2's exit criterion: every
      # other GPDL test checks the port against a reading of the C++ source, and only this one
      # checks it against the C++ binary.
      #
      # Two traps, both from GPDL.cpp:
      #
      #  1. It calls gets_s() after its usage banner (:40) and after every error message (:58).
      #     A script that fails to compile, or a bad argument, therefore BLOCKS ON STDIN FOREVER
      #     and hangs the runner until the job timeout. Stdin is redirected from an empty file so
      #     gets_s hits EOF and returns immediately.
      #  2. The compile path always `return 0` (:111). A failed compile skips WriteCode entirely
      #     (the `if (result == 0)` guard at :96) and still exits 0, leaving an EMPTY .bin behind.
      #     So success is "the file exists and has bytes in it", never the exit code. Only usage()
      #     exits non-zero, and it does so after the gets_s above.
      - name: Compile GPDL goldens (reference compiler)
        id: gpdlgold
        timeout-minutes: 5
        shell: pwsh
        run: |
          $exe = (Resolve-Path "src\GPDL\Release\GPDLcomp.exe" -ErrorAction SilentlyContinue)
          if (-not $exe) { Write-Host "::error::GPDLcomp.exe not built"; exit 1 }

          $srcDir = "oracle\golden\gpdl"
          $outDir = "gpdl-goldens"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          # Absolute, because Start-Process resolves relative paths against the PROCESS working
          # directory rather than PowerShell's $PWD -- the two are not always the same, and a
          # relative output path can silently land outside the workspace.
          $outFull = (Resolve-Path $outDir).Path

          # Scripts the REFERENCE cannot compile. prototypes.txt puts GPDLcomp into a silent
          # infinite loop: addDictionary links a dictionary into its parent's m_offspring
          # (GPDLcomp.cpp:1117) and discardCurrent deletes it without unlinking (:2375), which a
          # forward declaration does, so m_countFunctions later walks freed memory (:1171). Runs
          # 31263750742 and 31289965658 both timed out with zero stderr and a zero-byte .bin --
          # the empty .bin proving the loop is inside WriteDictionary, before outarchive.Close()
          # could flush what WriteCode had already buffered.
          #
          # One source of truth, shared with GpdlOracleDiffTests.cs and dotnet.yml.
          $cannotCompile = @(Get-Content (Join-Path $srcDir "reference-cannot-compile.cfg") |
                             ForEach-Object { $_.Trim() } |
                             Where-Object { $_ -and -not $_.StartsWith('#') })

          $scripts = @(Get-ChildItem $srcDir -Filter *.txt |
                       Where-Object { $cannotCompile -notcontains $_.Name } |
                       Sort-Object Name)
          if ($scripts.Count -eq 0) {
            Write-Host "::error::no .txt scripts under $srcDir to compile"
            exit 1
          }
          Write-Host "skipping (reference cannot compile): $($cannotCompile -join ', ')"

          # gets_s reads from here and gets EOF. See trap 1 above.
          $stdin = Join-Path $env:RUNNER_TEMP "gpdl-stdin.txt"
          New-Item -ItemType File -Force -Path $stdin | Out-Null

          $bad = @()
          foreach ($s in $scripts) {
            $bin = Join-Path $outFull ($s.BaseName + ".bin")
            $lst = Join-Path $outFull ($s.BaseName + ".lst")
            $err = Join-Path $env:RUNNER_TEMP ($s.BaseName + ".stderr")

            # `cmd /c ... < NUL`, not Start-Process -RedirectStandardInput. The latter did NOT
            # stop GPDLcomp blocking on gets_s: run 31262873429 hung for the full five minutes on
            # structure.txt, the first script to reach an error prompt. cmd's own redirect is
            # applied by the shell before the process starts and is not negotiable.
            $p = Start-Process -FilePath "cmd.exe" `
                               -ArgumentList @("/c", "`"`"$($exe.Path)`" `"$($s.FullName)`" `"$bin`" `"$lst`" <NUL`"") `
                               -PassThru -NoNewWindow `
                               -RedirectStandardError $err

            # A per-script budget, so one bad script costs its own timeout instead of the whole
            # step's. INPUTFILE::error prompts via gets_s on its last diagnostic line
            # (GPDLcomp.cpp:363), and past twelve errors it stops prompting and just prints "." --
            # a parser that fails to advance then spins silently. Both look like a hang from here.
            $timedOut = $false
            if (-not $p.WaitForExit(45000)) {
              $timedOut = $true
              try { $p.Kill($true) } catch { }
              $p.WaitForExit(5000) | Out-Null
            }

            $size = if (Test-Path $bin) { (Get-Item $bin).Length } else { -1 }
            $code = if ($timedOut) { "TIMEOUT" } else { $p.ExitCode }
            $ok   = (-not $timedOut) -and ($p.ExitCode -eq 0) -and ($size -gt 0)
            "{0,-16} exit={1} bin={2} bytes" -f $s.Name, $code, $size

            if (-not $ok) {
              $bad += $s.Name
              if (Test-Path $err) {
                # Capped: the spin-on-"." path can produce a stderr file of unbounded size.
                Write-Host "--- $($s.Name) stderr (first 60 lines) ---"
                Get-Content $err -TotalCount 60 | ForEach-Object { Write-Host "  $_" }
                $bytes = (Get-Item $err).Length
                Write-Host "  [stderr total $bytes bytes]"
              }
            }
          }

          if ($bad.Count -gt 0) {
            Write-Host "::error::GPDLcomp produced no output for: $($bad -join ', ')"
            exit 1
          }

          # A PARTIAL set is the dangerous state: GpdlOracleDiffTests skips an unpaired .txt, so a
          # half-populated directory leaves the suite green over whatever it missed. The test
          # Goldens_are_either_complete_or_absent_but_never_partial guards the committed side; this
          # guards the produced side.
          $produced = @(Get-ChildItem $outDir -Filter *.bin).Count
          if ($produced -ne $scripts.Count) {
            Write-Host "::error::compiled $produced of $($scripts.Count) scripts - a partial golden set must not be published"
            exit 1
          }

          Get-ChildItem $outDir | ForEach-Object { "{0,-20} {1,8} bytes" -f $_.Name, $_.Length }

      - name: Upload GPDL goldens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpdl-goldens
          path: gpdl-goldens/**
          if-no-files-found: warn

      # Same drift check as the JSON dump below: once the .bin/.lst files are committed, a change
      # in what the reference compiler emits invalidates the baseline the port is judged against.
      - name: Check GPDL goldens against committed
        if: success()
        shell: pwsh
        run: |
          $committed = @(Get-ChildItem "oracle\golden\gpdl" -Filter *.bin -ErrorAction SilentlyContinue)
          if ($committed.Count -eq 0) {
            Write-Host "::notice::No committed GPDL goldens yet. Download the gpdl-goldens artifact and commit its .bin and .lst files into oracle/golden/gpdl/ to activate GpdlOracleDiffTests and close Phase 2's exit criterion."
            exit 0
          }

          $drift = @()
          foreach ($f in Get-ChildItem "gpdl-goldens" -File) {
            $old = Join-Path "oracle\golden\gpdl" $f.Name
            if (-not (Test-Path $old)) { $drift += "$($f.Name) (new)"; continue }
            $a = Get-FileHash $f.FullName -Algorithm SHA256
            $b = Get-FileHash $old        -Algorithm SHA256
            if ($a.Hash -ne $b.Hash) { $drift += $f.Name }
          }

          if ($drift.Count -gt 0) {
            Write-Host "::error::reference compiler output changed for: $($drift -join ', ')"
            exit 1
          }
          Write-Host "fresh GPDL output matches the committed goldens"

      # Detect REFERENCE drift: if a committed golden file exists, the freshly generated dump must
      # still match it. A change here means the C++ side's behaviour moved, which invalidates the
      # baseline the C# port is being validated against -- so it must be seen, not silently
      # absorbed. _meta.diagnostics is excluded: it is informational and carries absolute paths.
      - name: Check dump against committed golden
        if: success()
        shell: pwsh
        run: |
          $golden = "oracle/golden/DefaultDesign.json"
          if (-not (Test-Path $golden)) {
            Write-Host "::notice::No committed golden yet. Download the oracle-json artifact and commit it to $golden to enable drift detection and activate OracleDiffTests."
            exit 0
          }
          function Strip($path) {
            $o = Get-Content $path -Raw | ConvertFrom-Json
            $o._meta.PSObject.Properties.Remove('diagnostics')
            return ($o | ConvertTo-Json -Depth 30 -Compress)
          }
          $fresh = Strip "oracle-DefaultDesign.json"
          $base  = Strip $golden
          if ($fresh -ne $base) {
            Write-Host "::error::Fresh dump differs from oracle/golden/DefaultDesign.json - the reference implementation's output has changed."
            Write-Host "--- committed ---"; Write-Host $base
            Write-Host "--- fresh ---";     Write-Host $fresh
            exit 1
          }
          Write-Host "fresh dump matches the committed golden"

      - name: Upload golden JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-json
          path: |
            oracle-*.json
            **/UAFErrors.txt
          if-no-files-found: warn

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $rows = @(
            @{ n='GPDLcomp';  r='${{ steps.gpdl.outcome }}' }
            @{ n='UAFWin';    r='${{ steps.uafwin.outcome }}' }
            @{ n='UAFWinEd';  r='${{ steps.uafwined.outcome }}' }
            @{ n='JSON dump'; r='${{ steps.dump.outcome }}' }
            @{ n='Tier-3 fixture'; r='${{ steps.tier3.outcome }}' }
            @{ n='GPDL goldens'; r='${{ steps.gpdlgold.outcome }}' }
          )
          "| Project | Result |"           | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          "|---|---|"                      | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          foreach ($x in $rows) {
            $icon = if ($x.r -eq 'success') { '✅' } else { '❌' }
            "| $($x.n) | $icon $($x.r) |"  | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-binaries
          path: |
            src/**/Release/*.exe
            src/**/Release/*.lib
          if-no-files-found: warn

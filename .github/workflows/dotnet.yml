# Build and test the .NET 10 port (dotnet/).
# The legacy C++ reference build lives in oracle-cpp.yml.

name: .NET

on:
  push:
    paths:
      - 'dotnet/**'
      # The golden dump is an input to OracleDiffTests, so a new one must re-run them.
      - 'oracle/golden/**'
      # DesignVersion.Generated.cs is transcribed from these, and the staleness job checks it.
      - 'src/Shared/Externs.h'
      - 'src/Shared/Globals.cpp'
      - '.github/workflows/dotnet.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore dotnet/UAF.slnx

      - name: Build
        run: dotnet build dotnet/UAF.slnx --no-restore -c Release

      - name: Test
        run: dotnet test dotnet/UAF.slnx --no-build -c Release --verbosity normal

      # OracleDiffTests return early when the golden dump is absent (xUnit 2.9 has no
      # Assert.Skip), so from the test summary alone a missing fixture is indistinguishable from
      # a passing comparison. Surface it explicitly instead.
      - name: Warn if the oracle golden dump is missing
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          if [ -f oracle/golden/DefaultDesign.json ]; then
            echo "golden dump present - OracleDiffTests are comparing against the reference"
          else
            echo "::warning::oracle/golden/DefaultDesign.json is missing; OracleDiffTests did NOT compare against the C++ reference. Produce it with the Oracle workflow and commit it."
          fi

  generated-code-is-current:
    # DesignVersion.Generated.cs is transcribed from the C++ headers. If someone edits
    # Externs.h or Globals.cpp without re-running the generator, the port silently drifts
    # away from the reference implementation's version gates.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check DesignVersion.Generated.cs is up to date
        run: python3 dotnet/tools/gen-design-versions.py --check

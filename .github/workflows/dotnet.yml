# Build and test the .NET 10 port (dotnet/).
# The legacy C++ reference build lives in oracle-cpp.yml.

name: .NET

on:
  push:
    paths:
      - 'dotnet/**'
      # The golden dump is an input to OracleDiffTests, so a new one must re-run them.
      - 'oracle/golden/**'
      # DesignVersion.Generated.cs is transcribed from these, and the staleness job checks it.
      - 'src/Shared/Externs.h'
      - 'src/Shared/Globals.cpp'
      # UAF.Scripting.Tests read these directly: TalkCorpusTests pins talk.txt's byte length and
      # the line number of its first dead call, and asserts which names are absent from
      # systemfunctions[]. Editing either without re-running the tests hides a real divergence.
      - 'src/GPDL/**'
      - 'src/Shared/GPDLOpCodes.h'
      - 'src/Shared/GPDLcomp.cpp'
      - '.github/workflows/dotnet.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Tier-3 (LZW) fixtures. reference/ is gitignored, so without this the tier-3 tests return
      # early in CI and silently pass without exercising the decompressor at all -- the exact
      # failure mode that let a mis-modelled field survive three attempts locally.
      #
      # This repo is public and is the upstream default Dungeon Craft data set (version 5.28,
      # past the 0.930 compression gate), so it can be fetched without redistributing anything.
      - name: Fetch tier-3 LZW fixture
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p reference/dc-default
          if git clone --depth 1 -q \
              https://github.com/manikus/default_data-files_for_Dungeon_Craft.git \
              reference/dc-default/data-files; then
            echo "fetched $(ls reference/dc-default/data-files | wc -l) files"
            ls -la reference/dc-default/data-files/items.dat
          else
            echo "::warning::could not fetch the tier-3 fixture; LZW tests will not run this job"
          fi

      - name: Restore
        run: dotnet restore dotnet/UAF.slnx

      - name: Build
        run: dotnet build dotnet/UAF.slnx --no-restore -c Release

      # UAF.Media.Tests exercises the real SDL3 backend -- window, streaming texture, event queue and
      # audio device. It forces the dummy drivers from inside the process (see HeadlessDrivers.cs,
      # which explains why a hint and not an environment variable), so these two are belt and braces:
      # they make the intent visible here and cover anything run outside the test host.
      - name: Test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: dotnet test dotnet/UAF.slnx --no-build -c Release --verbosity normal

      # OracleDiffTests return early when the golden dump is absent (xUnit 2.9 has no
      # Assert.Skip), so from the test summary alone a missing fixture is indistinguishable from
      # a passing comparison. Surface it explicitly instead.
      # Run uaf-fileprobe over whole designs. The unit tests cover types in isolation; this is
      # the integration path, and it is where the game.dat mid-stream-compression bug actually
      # surfaced -- every per-type test passed while it was broken, because the databases in the
      # same folder read fine.
      #
      # DefaultDesign ships in the repo (tier 1/2). The manikus set is fetched above and is 5.28,
      # so both game.dat framings and all three archive tiers get exercised.
      - name: uaf-fileprobe over whole designs
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            echo "--- $1"
            dotnet run --project dotnet/tools/uaf-fileprobe -c Release -- "$1" > probe.json
            # A non-empty design name is the assertion that matters: the mid-stream-compression
            # bug produced binary noise here, never an error exit.
            name=$(python3 -c "import json;print(json.load(open('probe.json'))['globalData']['designName'])")
            ok=$(python3 -c "import json;print(json.load(open('probe.json'))['_meta']['ok'])")
            echo "    name='$name' ok=$ok"
            test -n "$name" || { echo "::error::empty designName for $1"; exit 1; }
            test "$ok" = "True" || { echo "::error::probe reported not-ok for $1"; exit 1; }
          }
          probe src/UAFWinEd/DefaultDesign.dsn
          if [ -f reference/dc-default/data-files/game.dat ]; then
            probe reference/dc-default/data-files
          else
            echo "::warning::tier-3 fixture absent; only the plain framing was probed"
          fi

      # SDL3 spike (task #9). Phase 3 plans to use SDL3 for the game's window, presentation and
      # input, so this proves the bindings actually work on every target platform BEFORE the
      # media layer depends on them. It exercises the real model -- a managed software
      # framebuffer pushed through a streaming texture -- not just SDL_Init.
      #
      # Forced headless: CI has no display, and UAF.Media must stay testable there. That
      # constraint is why the C++ editor cannot run in CI at all (OpenDesign needs a live
      # DirectX device), and it is not a mistake worth repeating.
      - name: SDL3 binding spike
        continue-on-error: true
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: dotnet run --project dotnet/spike/Sdl3Spike -c Release

      - name: Warn if the oracle golden dump is missing
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          if [ -f oracle/golden/DefaultDesign.json ]; then
            echo "golden dump present - OracleDiffTests are comparing against the reference"
          else
            echo "::warning::oracle/golden/DefaultDesign.json is missing; OracleDiffTests did NOT compare against the C++ reference. Produce it with the Oracle workflow and commit it."
          fi

      # Same shape again, for the art. PngOracleTests and SdlImageDecoderTests probe for a file
      # their manifest names -- not for reference/ itself, which the fixture step above creates --
      # and return early when the corpus is absent, which it always is here: the designs are
      # gitignored. Say so out loud rather than letting six green tests imply 1312 files were
      # decoded.
      - name: Warn if the reference art corpus is missing
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          # One awk, no pipe. `grep ... | head -1` looks equivalent and is not: head closes the
          # pipe on the first line of a 161 KB manifest, grep dies of SIGPIPE, and this shell runs
          # with `-eo pipefail`, so an informational step failed the whole job.
          first=$(awk -F'|' '!/^#/ && NF { print $1; exit }' \
                  dotnet/tests/UAF.Media.Tests/Assets/png-oracle.txt)
          if [ -f "reference/$first" ]; then
            echo "art corpus present - the PNG and legacy-art oracle tests are comparing pixels"
          else
            echo "::warning::reference/ carries no design art; PngOracleTests and SdlImageDecoderTests returned early, so neither decoder was checked against its oracle in this job."
          fi

      # Same shape as the check above, for the same reason: GpdlOracleDiffTests return early when
      # the reference bytecode is absent, so a green suite over an empty corpus looks identical to a
      # green suite over a matching one. Byte-identity with GPDLcomp.exe is Phase 2's exit criterion
      # and it cannot be demonstrated without these files.
      - name: Warn if the GPDL reference bytecode is missing
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          # find, not `ls glob | wc -l`: with no .bin files yet, ls exits non-zero, pipefail
          # propagates it and -e kills this step before it prints anything -- so the warning it
          # exists to emit never appeared, and the step read as a build failure instead.
          scripts=$(find oracle/golden/gpdl -maxdepth 1 -name '*.txt' | wc -l | tr -d ' ')
          goldens=$(find oracle/golden/gpdl -maxdepth 1 -name '*.bin' | wc -l | tr -d ' ')
          echo "GPDL corpus: $scripts script(s), $goldens golden(s)"
          if [ "$scripts" = "0" ]; then
            echo "::error::oracle/golden/gpdl holds no scripts; the GPDL corpus has gone missing"
            exit 1
          fi
          if [ "$goldens" != "$scripts" ]; then
            echo "::warning::$goldens of $scripts GPDL scripts have reference bytecode; GpdlOracleDiffTests skipped the rest, so gpdlc has NOT been shown to be byte-identical to GPDLcomp.exe. See oracle/golden/gpdl/README.md."
          fi

  generated-code-is-current:
    # DesignVersion.Generated.cs is transcribed from the C++ headers. If someone edits
    # Externs.h or Globals.cpp without re-running the generator, the port silently drifts
    # away from the reference implementation's version gates.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check DesignVersion.Generated.cs is up to date
        run: python3 dotnet/tools/gen-design-versions.py --check
      - name: Check CombatTiles.Generated.cs is up to date
        run: python3 dotnet/tools/gen-combat-tiles.py --check
      - name: Check PartyArrangements.Generated.cs is up to date
        run: python3 dotnet/tools/gen-party-arrangements.py --check
